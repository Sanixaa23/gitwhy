[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gitwhy"
version = "0.1.0"
description = "Bir git komutu basarisiz oldugunda deponun durumunu okur ve o duruma ozel duzeltme komutunu uretir."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
gitwhy = "gitwhy.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/gitwhy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
