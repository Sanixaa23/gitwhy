name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  scenario-accuracy:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: dependencies
        run: python -m pip install -e ".[dev]"
      - name: tests
        run: python -m pytest -q
      - name: confusion matrix
        run: python tests/test_rules.py

  wrapper:
    # Unit tests cannot cover the shell wrapper: there is no shell there.
    # Here it is genuinely installed and tried against real git failures.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e .
      - name: install zsh
        run: sudo apt-get update && sudo apt-get install -y zsh
      - name: bash
        run: bash tools/wrapper_test.sh
      - name: bash + GITWHY_TEE
        run: GITWHY_TEE=1 bash tools/wrapper_test.sh
      - name: zsh
        run: zsh tools/wrapper_test.sh
      - name: zsh + GITWHY_TEE
        run: GITWHY_TEE=1 zsh tools/wrapper_test.sh
